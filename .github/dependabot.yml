# Basic `dependabot.yml` file with
# minimum configuration for two package managers

version: 2
updates:
  # Enable version updates for NuGet
  - package-ecosystem: "nuget"
    # Look for `*.csproj` and `Directory.Packages.props` files in the `root` directory
    directory: "/"
    # Check for updates twice monthly, on the 1st and 15th at 09:00 UTC.
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
    groups:
      # Review breaking Orleans upgrades together, separately from routine updates.
      orleans-major:
        patterns:
          - "Microsoft.Orleans.*"
        update-types:
          - "major"
      # Review breaking Aspire upgrades together, separately from routine updates.
      aspire-major:
        patterns:
          - "Aspire.*"
        update-types:
          - "major"
      # Validate all routine NuGet updates together as one integration stack.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    # Use the same twice-monthly schedule as NuGet.
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
